<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="少昊导航，一个把常用网站、博客文章和个人工作流整理到一起的效率导航工具。"
    >
    <meta name="robots" content="index,follow">
    <meta property="og:title" content="少昊导航">
    <meta property="og:description" content="少昊导航，一个把常用网站、博客文章和个人工作流整理到一起的效率导航工具。">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="少昊导航">
    <meta property="og:url" content="https://845864204.xyz/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="少昊导航">
    <meta name="twitter:description" content="少昊导航，一个把常用网站、博客文章和个人工作流整理到一起的效率导航工具。">
    <link rel="canonical" href="https://845864204.xyz/">
    <link rel="alternate" type="application/rss+xml" title="少昊导航 RSS" href="https://845864204.xyz/rss.xml">
    <title>少昊导航</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=4">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=4">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
    <script>
      (() => {
        const themeKey = "nav-tool.theme";
        const themeVersionKey = "nav-tool.themeVersion";
        const themePresetKey = "nav-tool.themePreset";
        const currentThemeVersion = "2";
        const validThemes = new Set(["dark", "light"]);
        let stored = "";
        let storedVersion = "";
        let storedPreset = "";

        try {
          stored = localStorage.getItem(themeKey) || "";
          storedVersion = localStorage.getItem(themeVersionKey) || "";
          storedPreset = localStorage.getItem(themePresetKey) || "";
        } catch {
          stored = "";
          storedVersion = "";
          storedPreset = "";
        }

        const theme = storedVersion === currentThemeVersion && validThemes.has(stored) ? stored : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreset = storedPreset || "aurora";
        document.documentElement.style.colorScheme = theme;

        if (storedVersion !== currentThemeVersion || !validThemes.has(stored)) {
          try {
            localStorage.setItem(themeKey, theme);
            localStorage.setItem(themeVersionKey, currentThemeVersion);
          } catch {
          }
        }
      })();
    </script>
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
